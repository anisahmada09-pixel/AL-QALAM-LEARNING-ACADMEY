<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* ============================================================
   AL QALAM LEARNING ACEMEYY — DESIGN SYSTEM
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#f4f6fb;color:#0f172a;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
.muted{color:#64748b}
.sm{font-size:12.5px}
.spacer{flex:1}

/* ---------- header ---------- */
.app-header{
  position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid #e9edf5;
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  box-shadow:0 1px 0 rgba(16,24,40,.03);
}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid #e6ebf3;background:#fff;
  font-size:18px;cursor:pointer;display:grid;place-items:center;color:#334155;
}
.icon-btn:active{transform:scale(.96)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-weight:800;font-size:19px;
  box-shadow:0 8px 18px -10px rgba(124,58,237,.9);
}
.brand-name{font-weight:800;font-size:15px;line-height:1.1}
.brand-sub{font-size:11px;color:#64748b;line-height:1.2}
.role-sel{
  border:1px solid #e2e8f0;background:#f8fafc;border-radius:11px;padding:8px 10px;
  font-size:13px;font-weight:600;color:#334155;cursor:pointer;max-width:130px;
}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:60;opacity:0;pointer-events:none;transition:.18s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:280px;max-width:82vw;background:#fff;z-index:70;
  transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column;
  box-shadow:12px 0 40px -20px rgba(15,23,42,.5);
}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;gap:10px;align-items:center;padding:16px;border-bottom:1px solid #eef2f7}
.drawer-links{overflow:auto;padding:10px;flex:1}
.drawer-links a{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
  text-decoration:none;color:#1e293b;font-weight:600;font-size:14px;
}
.drawer-links a:hover{background:#f5f7fc}
.drawer-links .di{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;color:#fff}

/* ---------- layout ---------- */
#view{max-width:1180px;margin:0 auto;padding:16px 14px 90px}
.card{
  background:#fff;border:1px solid #eaeef6;border-radius:18px;padding:16px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 10px 26px -22px rgba(16,24,40,.55);
  margin-bottom:14px;
}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{font-size:15.5px}
.page-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.page-title{font-size:20px}
.page-sub{font-size:12.5px;color:#64748b}

/* ---------- hero ---------- */
.hero{
  border-radius:22px;padding:20px;color:#fff;margin-bottom:14px;
  background:linear-gradient(135deg,#7c3aed 0%,#6366f1 45%,#06b6d4 100%);
  box-shadow:0 20px 40px -26px rgba(99,102,241,.95);
  display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;
}
.hero-sub{font-size:12.5px;opacity:.9;font-weight:600}
.hero-title{font-size:25px;margin:4px 0 6px}
.hero-p{font-size:13px;opacity:.92;max-width:520px;margin:0}
.hero-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:8px 12px;border-radius:12px;font-size:12px;font-weight:600}

/* ---------- stat cards ---------- */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{border-radius:18px;padding:14px;color:#fff;box-shadow:0 14px 26px -20px rgba(15,23,42,.8)}
.stat .k{font-size:11.5px;opacity:.92;font-weight:600}
.stat .v{font-size:24px;font-weight:800;margin-top:4px;line-height:1}
.stat .s{font-size:11px;opacity:.88;margin-top:5px}

/* ---------- module grid ---------- */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px}
.mod{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:8px;padding:11px 3px;border-radius:16px;cursor:pointer}
.mod:hover{background:#f6f8fd}
.mod:active{transform:scale(.97)}
.mod .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:23px;color:#fff;box-shadow:0 10px 20px -12px rgba(15,23,42,.7)}
.mod .nm{font-size:11.5px;font-weight:600;color:#334155;text-align:center;line-height:1.2}

/* ---------- gradients ---------- */
.g1{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.g2{background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.g3{background:linear-gradient(135deg,#f97316,#fbbf24)}
.g4{background:linear-gradient(135deg,#10b981,#34d399)}
.g5{background:linear-gradient(135deg,#ec4899,#f472b6)}
.g6{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.g7{background:linear-gradient(135deg,#ef4444,#f97316)}
.g8{background:linear-gradient(135deg,#0ea5e9,#22d3ee)}

/* ---------- forms ---------- */
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:#475569}
input,select,textarea{
  font-family:inherit;font-size:14px;color:#0f172a;background:#fff;
  border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;outline:none;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.18)}
textarea{min-height:80px;resize:vertical}
.search{max-width:320px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.gap{gap:10px}
.grow{flex:1;min-width:140px}
.mt{margin-top:12px}
.mb{margin-bottom:12px}

/* ---------- buttons ---------- */
.btn{
  border:0;border-radius:12px;padding:10px 15px;font-size:13.5px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-family:inherit;
  box-shadow:0 10px 20px -14px rgba(124,58,237,.95);white-space:nowrap;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:#334155;border:1px solid #e2e8f0;box-shadow:none}
.btn.green{background:linear-gradient(135deg,#10b981,#22d3ee)}
.btn.orange{background:linear-gradient(135deg,#f97316,#fbbf24)}
.btn.red{background:linear-gradient(135deg,#ef4444,#f97316)}
.btn.dark{background:linear-gradient(135deg,#1e293b,#334155)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.xs{padding:5px 9px;font-size:11.5px;border-radius:9px}

/* ---------- pills / badges ---------- */
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:#eef2f7;color:#475569}
.pill.ok{background:#dcfce7;color:#166534}
.pill.bad{background:#fee2e2;color:#991b1b}
.pill.warn{background:#fef3c7;color:#92400e}
.pill.info{background:#e0e7ff;color:#3730a3}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:700;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid #eef2f7;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #f3f6fa;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#fafbff}

/* ---------- attendance rows ---------- */
.att-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #f2f5fa}
.att-row:last-child{border-bottom:0}
.att-info{flex:1;min-width:0}
.att-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-sub{font-size:11.5px;color:#64748b}
.seg{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:12px}
.segbtn{
  border:0;background:transparent;width:38px;height:32px;border-radius:9px;font-weight:800;
  font-size:12.5px;color:#64748b;cursor:pointer;font-family:inherit;
}
.segbtn.P.on{background:#10b981;color:#fff}
.segbtn.A.on{background:#ef4444;color:#fff}
.segbtn.L.on{background:#f59e0b;color:#fff}

/* ---------- progress ring ---------- */
.ring{
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--c) calc(var(--p)*1%), #e8edf6 0);flex:none;
}
.ring::before{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
.ring span{position:relative;z-index:1;font-size:10.5px;font-weight:800;color:#0f172a}

/* ---------- class cards ---------- */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.class-card{
  border-radius:18px;padding:16px;color:#fff;cursor:pointer;border:0;text-align:left;
  box-shadow:0 14px 26px -20px rgba(15,23,42,.85);font-family:inherit;
}
.class-card:active{transform:scale(.98)}
.class-card .cn{font-size:16px;font-weight:800}
.class-card .cs{font-size:11.5px;opacity:.9;margin-top:4px}

/* ---------- misc ---------- */
.empty{padding:26px 12px;text-align:center;color:#94a3b8;font-size:13.5px}
.empty .e-ic{font-size:30px;display:block;margin-bottom:8px;opacity:.6}
.tabs{display:flex;gap:6px;background:#f1f5f9;padding:5px;border-radius:14px;width:fit-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;color:#64748b;cursor:pointer;font-family:inherit;white-space:nowrap}
.tabs button.on{background:#fff;color:#0f172a;box-shadow:0 2px 8px -3px rgba(15,23,42,.25)}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px -30px rgba(15,23,42,.9)}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid #eef2f7}
.modal-head h3{font-size:16px;flex:1}
.modal-head .x{border:0;background:#f1f5f9;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:15px;color:#475569}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{padding:13px 18px;border-top:1px solid #eef2f7;display:flex;gap:10px;justify-content:flex-end}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);z-index:99;
  background:#0f172a;color:#fff;padding:12px 18px;border-radius:13px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.24s;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#b91c1c}
#toast.ok{background:#047857}

/* ---------- print ---------- */
#printArea{display:none}
.p-head{display:flex;gap:14px;align-items:center;border-bottom:3px solid #7c3aed;padding-bottom:10px;margin-bottom:16px}
.p-logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800}
.p-name{font-size:21px;font-weight:800}
.p-tag{font-size:12px;color:#64748b}
.p-title{text-align:center;font-size:17px;margin:0 0 6px}
.p-meta{text-align:center;font-size:12px;color:#475569;margin-bottom:14px}
.p-sign{display:flex;justify-content:space-between;margin-top:40px;font-size:12.5px;gap:20px}
.p-note{margin-top:22px;text-align:center;font-size:10.5px;color:#94a3b8;border-top:1px solid #e5e7eb;padding-top:8px}
#printArea table{width:100%;border-collapse:collapse;font-size:12px}
#printArea th,#printArea td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left}
#printArea th{background:#f1f5f9;font-weight:700}

@media print{
  .app-header,.drawer,.scrim,#view,#modalRoot,#toast,.no-print{display:none !important}
  body{background:#fff}
  #printArea{display:block !important}
  @page{margin:14mm}
}
@media (max-width:640px){
  .hero-title{font-size:21px}
  .page-title{font-size:18px}
  .search{max-width:100%}
  .brand-sub{display:none}
}
</style>

<body>

<!-- ================= HEADER ================= -->
<header class="app-header">
  <button class="icon-btn" onclick="toggleDrawer(true)" aria-label="Open menu">☰</button>
  <div class="brand" onclick="nav('dashboard',{})">
    <div class="logo">A</div>
    <div>
      <div class="brand-name">Anisuno Academy</div>
      <div class="brand-sub">School Management System</div>
    </div>
  </div>
  <div class="spacer"></div>
  <select class="role-sel" id="roleSel" onchange="setRole(this.value)" title="Switch role (demo)">
    <option>Admin</option>
    <option>Teacher</option>
    <option>Student/Parent</option>
  </select>
</header>

<!-- ================= DRAWER ================= -->
<div class="scrim" id="scrim" onclick="toggleDrawer(false)"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="logo">A</div>
    <div>
      <b>Anisuno Academy</b>
      <div class="muted sm">Navigation</div>
    </div>
  </div>
  <div class="drawer-links" id="drawerLinks"></div>
</aside>

<!-- ================= MAIN ================= -->
<main id="view"></main>

<!-- ================= MODAL / TOAST / PRINT ================= -->
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* ============================================================================
   ANISUNO ACADEMY — SCHOOL MANAGEMENT SYSTEM (single-file prototype)
   Storage: browser localStorage  |  All sample records are DEMO DATA ONLY.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   1. UTILITIES
--------------------------------------------------------------------------- */
const KEY = 'anisuno_db_v1';
const ROLE_KEY = 'anisuno_role';
let DB = null;

const uid = p => (p || 'id') + Math.random().toString(36).slice(2, 9);
const todayISO = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'Rs ' + Number(n || 0).toLocaleString();
const clsName = id => (DB.classes.find(c => c.id === id) || {}).name || '—';
const stuName = id => (DB.students.find(s => s.id === id) || {}).name || '—';
const byRoll = (a, b) => Number(a.roll) - Number(b.roll);

function grade(p){
  if (p >= 90) return 'A+';
  if (p >= 80) return 'A';
  if (p >= 70) return 'B';
  if (p >= 60) return 'C';
  if (p >= 50) return 'D';
  if (p >= 40) return 'E';
  return 'F';
}

function saveDB(){ localStorage.setItem(KEY, JSON.stringify(DB)); }

function loadDB(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ raw = null; }
  if (raw) {
    try { DB = JSON.parse(raw); } catch(e){ DB = null; }
  }
  if (!DB || !DB.classes || !DB.classes.length) { DB = seedDB(); saveDB(); }
}

function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (kind || '');
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = ''; }, 2600);
}

function openModal(title, bodyHtml, footHtml, wide){
  document.getElementById('modalRoot').innerHTML =
    `<div class="modal-wrap" onclick="if(event.target===this)closeModal()">
       <div class="modal ${wide ? 'wide' : ''}">
         <div class="modal-head"><h3>${esc(title)}</h3><button class="x" onclick="closeModal()">✕</button></div>
         <div class="modal-body">${bodyHtml}</div>
         ${footHtml ? `<div class="modal-foot">${footHtml}</div>` : ''}
       </div>
     </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('open', !!open);
  document.getElementById('scrim').classList.toggle('show', !!open);
}

/* ---------------------------------------------------------------------------
   2. SEED DATA  (DEMO ONLY — not real school records)
--------------------------------------------------------------------------- */
function seedDB(){
  const classNames = ['Nursery','Play Group','Prep/KG','Class 1','Class 2','Class 3','Class 4',
    'Class 5','Class 6','Class 7','Class 8','Class 9','Class 10','First Year','Second Year'];
  const classes = classNames.map((n, i) => ({ id: 'c' + (i + 1), name: n, sections: ['A', 'B'] }));

  const names = ['Muhammad Umar','Ayesha Khan','Ali Hassan','Fatima Noor','Bilal Ahmed',
    'Zainab Iqbal','Hassan Raza','Maryam Shah','Usman Tariq','Hira Aslam','Ahmad Raza',
    'Sana Malik','Hamza Sheikh','Areeba Javed','Saad Iqbal','Noor Fatima','Ibrahim Khan',
    'Amna Yousaf','Zaid Ali','Laiba Anwar'];
  const fathers = ['Imran Khan','Kamran Ali','Nadeem Aslam','Tariq Mahmood','Shahid Iqbal',
    'Yousaf Raza','Aslam Sheikh','Javed Malik','Waseem Abbas','Rashid Minhas'];

  const students = [];
  classes.forEach((c, ci) => {
    for (let i = 0; i < 4; i++) {
      const idx = (ci * 4 + i) % names.length;
      students.push({
        id: 's' + (students.length + 1),
        name: names[idx],
        father: fathers[(ci * 2 + i) % fathers.length],
        roll: i + 1,
        classId: c.id,
        section: i < 2 ? 'A' : 'B',
        dob: '201' + (3 + (ci % 6)) + '-0' + (1 + (i % 9)) + '-1' + (i % 9),
        gender: i % 2 ? 'Female' : 'Male',
        admission: '2024-04-0' + (1 + (i % 9)),
        contact: '0300-12345' + (10 + i),
        address: 'House ' + (i + 1) + ', Street ' + (ci + 1) + ', Lahore',
        guardian: 'Guardian of ' + names[idx],
        photo: ''
      });
    }
  });

  const teachers = [
    { id: 't1', name: 'Sir Kamran Ali', subject: 'Mathematics', phone: '0301-1110001' },
    { id: 't2', name: 'Miss Ayesha Siddiqui', subject: 'English', phone: '0301-1110002' },
    { id: 't3', name: 'Sir Bilal Hussain', subject: 'Science', phone: '0301-1110003' },
    { id: 't4', name: 'Miss Hina Rauf', subject: 'Urdu', phone: '0301-1110004' },
    { id: 't5', name: 'Sir Danish Mehmood', subject: 'Computer', phone: '0301-1110005' },
    { id: 't6', name: 'Miss Sana Tariq', subject: 'Islamiat', phone: '0301-1110006' }
  ];

  /* --- attendance: last 3 days for first 6 classes --- */
  const attendance = [];
  const dates = [0, 1, 2].map(d => { const dt = new Date(); dt.setDate(dt.getDate() - d); return dt.toISOString().slice(0, 10); });
  dates.forEach((dt, di) => {
    classes.slice(0, 6).forEach(c => {
      ['A', 'B'].forEach(sec => {
        const rec = {};
        students.filter(s => s.classId === c.id && s.section === sec).forEach((s, i) => {
          rec[s.id] = ['P', 'P', 'P', 'A', 'L'][(i + di) % 5];
        });
        if (Object.keys(rec).length) {
          attendance.push({ id: uid('at'), date: dt, classId: c.id, section: sec, records: rec, by: 'Demo Teacher' });
        }
      });
    });
  });

  /* --- fees: current month for every student --- */
  const month = new Date().toISOString().slice(0, 7);
  const fees = students.map((s, i) => {
    const status = ['Paid', 'Unpaid', 'Partial'][i % 3];
    const amount = 3500;
    return {
      id: uid('f'), studentId: s.id, month, type: 'Monthly Fee', amount,
      paid: status === 'Paid' ? amount : (status === 'Partial' ? 1500 : 0),
      status, date: status === 'Unpaid' ? '' : todayISO(), method: 'Cash'
    };
  });

  /* --- tests / exams --- */
  const tests = [];
  const subjects = ['English', 'Urdu', 'Mathematics', 'Science'];
  classes.slice(0, 5).forEach((c, ci) => {
    const sts = students.filter(s => s.classId === c.id);
    const rec = {};
    sts.forEach((s, i) => { rec[s.id] = { theory: (i === 3 ? 0 : 9 + i), practical: 0, absent: i === 3 }; });
    tests.push({
      id: uid('te'), kind: 'test', classId: c.id, subject: subjects[ci % 4],
      title: subjects[ci % 4] + ' Test', date: todayISO(), total: 15, practicalMax: 0, records: rec
    });
  });
  tests.push({

function classOptions(selected){
  return DB.classes.map(c => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
}
function sectionOptions(cls, selected){
  const secs = (DB.classes.find(c => c.id === cls) || { sections: ['A'] }).sections;
  return secs.map(s => `<option ${s === selected ? 'selected' : ''}>${esc(s)}</option>`).join('');
}
function emptyState(msg, icon){
  return `<div class="empty"><span class="e-ic">${icon || '📭'}</span>${esc(msg)}</div>`;
}
function ringHTML(pct){
  const p = Math.max(0, Math.min(100, Math.round(pct)));
  const c = p >= 70 ? '#10b981' : p >= 40 ? '#f59e0b' : '#ef4444';
  return `<div class="ring" style="--p:${p};--c:${c}"><span>${p}%</span></div>`;
}

function pageAttendance(){
  if (!attState.classId) attState.classId = DB.classes[0].id;

    <div id="attRows"></div>
  </div>

  <div class="card" id="attReport"></div>`;

  renderAttRows();

function loadAttRecords(){
  const rec = DB.attendance.find(a =>
    a.date === attState.date && a.classId === attState.classId && a.section === attState.section);
  attState.records = rec ? Object.assign({}, rec.records) : {};
}

function attStudents(){
  const q = attState.search.trim().toLowerCase();
  return DB.students
    .filter(s => s.classId === attState.classId && s.section === attState.section)
    .filter(s => !q || s.name.toLowerCase().includes(q) || String(s.roll).includes(q))
    .sort(byRoll);
}

function renderAttRows(){
  const list = attStudents();
  const box = document.getElementById('attRows');
  if (!box) return;
  const cnt = document.getElementById('attCount');
  if (cnt) {
    const markedCount = Object.keys(attState.records).length;
    cnt.textContent = list.length + ' students · ' + markedCount + ' marked';
  }
  if (!list.length) { box.innerHTML = emptyState('No students in this class/section.', '🎒'); return; }
  box.innerHTML = list.map(s => {
    const st = attState.records[s.id] || '';
    return `<div class="att-row">
      <div class="att-info">
        <div class="att-name">${esc(s.name)}</div>
        <div class="att-sub">S/O ${esc(s.father)} · Roll ${esc(s.roll)}</div>
      </div>
      <div class="seg">
        <button class="segbtn P ${st === 'P' ? 'on' : ''}" onclick="attMark('${s.id}','P')">P</button>
        <button class="segbtn A ${st === 'A' ? 'on' : ''}" onclick="attMark('${s.id}','A')">A</button>
        <button class="segbtn L ${st === 'L' ? 'on' : ''}" onclick="attMark('${s.id}','L')">L</button>
      </div>
    </div>`;
  }).join('');
}

function attMark(id, status){
  if (!guard(true)) return;
  attState.records[id] = status;
  renderAttRows();
}
function attMarkAll(status){
  if (!guard(true)) return;
  attStudents().forEach(s => { attState.records[s.id] = status; });
  renderAttRows();
  toast('All students marked as ' + ({P:'Present',A:'Absent',L:'Leave'}[status]));
}

function saveAttendance(){
  if (!guard(true)) return;
  const idx = DB.attendance.findIndex(a =>
    a.date === attState.date && a.classId === attState.classId && a.section === attState.section);
  const payload = {
    date: attState.date, classId: attState.classId, section: attState.section,
    records: attState.records, by: state.role
  };
  if (idx >= 0) DB.attendance[idx] = Object.assign(DB.attendance[idx], payload);
  else DB.attendance.push(Object.assign({ id: uid('at') }, payload));
  saveDB();
  toast('Attendance saved for ' + attState.date, 'ok');
  renderAttReport();
}

function inRange(dateStr, period){
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  if (period === 'day') return dateStr === todayISO();
  if (period === 'week') { const w = new Date(); w.setDate(w.getDate() - 7); return d >= w; }
  if (period === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  if (period === 'year') return d.getFullYear() === now.getFullYear();
  return true;
}

function renderAttReport(){
  const box = document.getElementById('attReport');
  if (!box) return;
  const records = DB.attendance.filter(a =>
    a.classId === attState.classId && a.section === attState.section &&
    inRange(a.date, attState.reportPeriod));

  const stats = {};
  DB.students.filter(s => s.classId === attState.classId && s.section === attState.section).forEach(s => {
    stats[s.id] = { P: 0, A: 0, L: 0, name: s.name, roll: s.roll, father: s.father };
  });
  records.forEach(a => {
    Object.entries(a.records).forEach(([sid, v]) => {
      if (stats[sid] && stats[sid][v] !== undefined) stats[sid][v]++;
    });
  });

  const rows = Object.entries(stats).sort((a, b) => a[1].roll - b[1].roll);

  box.innerHTML = `
    <div class="card-head">
      <h2>Attendance Report</h2>
      <select class="search" onchange="attState.reportPeriod=this.value;renderAttReport()">
        ${[['day','Daily'],['week','Weekly'],['month','Monthly'],['year','Yearly']].map(([v,l]) =>
          `<option value="${v}" ${attState.reportPeriod === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="printAttendanceReport()">🖨️ Print Report</button>
    </div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>Roll</th><th>Student</th><th>Present</th><th>Absent</th><th>Leave</th><th>Percentage</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(([sid, s]) => {
            const total = s.P + s.A + s.L;
            const pct = total ? Math.round(s.P / total * 100) : 0;
            return `<tr>
              <td>${esc(s.roll)}</td>
              <td><b>${esc(s.name)}</b><div class="muted sm">S/O ${esc(s.father)}</div></td>
              <td><span class="pill ok">${s.P}</span></td>
              <td><span class="pill bad">${s.A}</span></td>
              <td><span class="pill warn">${s.L}</span></td>
              <td><div class="row gap"><span>${pct}%</span>${ringHTML(pct)}</div></td>
            </tr>`;
          }).join('') : `<tr><td colspan="6">${emptyState('No attendance records for this period.')}</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function printAttendanceSheet(){
  const list = DB.students.filter(s => s.classId === attState.classId && s.section === attState.section).sort(byRoll);
  const body = `<table><thead><tr><th>#</th><th>Roll</th><th>Student Name</th><th>Father Name</th><th>Status</th></tr></thead><tbody>
    ${list.map((s, i) => {
      const st = attState.records[s.id] || '—';
      return `<tr><td>${i + 1}</td><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${esc(s.father)}</td>
        <td>${st === 'P' ? 'Present' : st === 'A' ? 'Absent' : st === 'L' ? 'Leave' : 'Not marked'}</td></tr>`;
    }).join('')}
  </tbody></table>`;
  printDoc('Daily Attendance Sheet', body,
    `${clsName(attState.classId)} — Section ${attState.section} &nbsp;|&nbsp; Date: ${attState.date}`);
}

function printAttendanceReport(){
  const records = DB.attendance.filter(a =>
    a.classId === attState.classId && a.section === attState.section && inRange(a.date, attState.reportPeriod));
  const stats = {};
  DB.students.filter(s => s.classId === attState.classId && s.section === attState.section).forEach(s => {
    stats[s.id] = { P: 0, A: 0, L: 0, name: s.name, roll: s.roll, father: s.father };
  });
  records.forEach(a => Object.entries(a.records).forEach(([sid, v]) => { if (stats[sid]) stats[sid][v]++; }));
  const body = `<table><thead><tr><th>Roll</th><th>Student</th><th>Father</th><th>Present</th><th>Absent</th><th>Leave</th><th>%</th></tr></thead><tbody>
    ${Object.values(stats).sort(byRoll).map(s => {
      const t = s.P + s.A + s.L;
      return `<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${esc(s.father)}</td>
        <td>${s.P}</td><td>${s.A}</td><td>${s.L}</td><td>${t ? Math.round(s.P / t * 100) : 0}%</td></tr>`;
    }).join('')}
  </tbody></table>`;
  printDoc('Attendance Summary Report', body,
    `${clsName(attState.classId)} — Section ${attState.section} &nbsp;|&nbsp; Period: ${attState.reportPeriod}`);
}

function teacherCheckIn(id){
  if (!guard(true)) return;
  DB.checkins.push({ id: uid('ci'), teacherId: id, date: todayISO(), in: new Date().toTimeString().slice(0, 5), out: '' });
  saveDB(); toast('Checked in successfully', 'ok'); pageCheckin();
}
function teacherCheckOut(id){
  if (!guard(true)) return;
  const rec = DB.checkins.find(c => c.teacherId === id && c.date === todayISO());
  if (!rec) return toast('No check-in found for today', 'bad');
  rec.out = new Date().toTimeString().slice(0, 5);
  saveDB(); toast('Checked out at ' + rec.out, 'ok'); pageCheckin();
}

function openLeaveForm(){
  if (!guard(true)) return;
  openModal('Request Leave', `
    <div class="grid2">
      <label class="fld">Teacher
        <select id="lvTeacher">${DB.teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
      </label>
      <label class="fld">Reason
        <input id="lvReason" placeholder="e.g. Medical appointment">
      </label>
      <label class="fld">Start Date<input type="date" id="lvFrom" value="${todayISO()}"></label>
      <label class="fld">End Date<input type="date" id="lvTo" value="${todayISO()}"></label>
    </div>
    <label class="fld mt">Attachment (optional note / file name)
      <input id="lvFile" placeholder="e.g. medical-certificate.pdf">
    </label>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn" onclick="submitLeave()">Submit Application</button>`);
}

function submitLeave(){
  const teacherId = document.getElementById('lvTeacher').value;
  const reason = document.getElementById('lvReason').value.trim();
  const from = document.getElementById('lvFrom').value;
  const to = document.getElementById('lvTo').value;
  const file = document.getElementById('lvFile').value.trim();
  if (!reason) return toast('Please enter a reason', 'bad');
  if (!from || !to) return toast('Please select dates', 'bad');
  if (to < from) return toast('End date cannot be before start date', 'bad');
  DB.leaves.push({ id: uid('lv'), teacherId, reason, from, to, status: 'Pending', comment: '', attachment: file });
  saveDB(); closeModal(); toast('Leave application submitted', 'ok'); pageCheckin();
}

function reviewLeave(id, status){
  if (!guard(false, 'admin')) return;
  const l = DB.leaves.find(x => x.id === id);
  if (!l) return;
  openModal('Review Leave — ' + status, `
    <p class="muted sm">Optional comment for the teacher:</p>
    <input id="rvComment" placeholder="Comment">`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn ${status === 'Accepted' ? 'green' : 'red'}" onclick="confirmReview('${id}','${status}')">Confirm ${status}</button>`);
}
function confirmReview(id, status){
  const l = DB.leaves.find(x => x.id === id);
  const c = document.getElementById('rvComment').value.trim();
  if (l) { l.status = status; l.comment = c || (status === 'Accepted' ? 'Approved by Admin' : 'Rejected by Admin'); }
  saveDB(); closeModal(); toast('Leave ' + status.toLowerCase(), status === 'Accepted' ? 'ok' : 'bad');
  pageCheckin();
}

function printTeacherAttendance(){
  const body = `<table><thead><tr><th>#</th><th>Teacher</th><th>Subject</th><th>Check-in</th><th>Check-out</th><th>Date</th></tr></thead><tbody>
    ${DB.checkins.length ? DB.checkins.map((c, i) => {
      const t = DB.teachers.find(x => x.id === c.teacherId) || {};
      return `<tr><td>${i + 1}</td><td>${esc(t.name || '—')}</td><td>${esc(t.subject || '—')}</td>

}

function saveClass(id){
  const name = document.getElementById('cfName').value.trim();
  const secs = document.getElementById('cfSecs').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!name) return toast('Class name is required', 'bad');
  if (!secs.length) return toast('At least one section is required', 'bad');
  if (id) {
    const c = DB.classes.find(x => x.id === id);
    c.name = name; c.sections = secs;
  } else {
    DB.classes.push({ id: uid('c'), name, sections: secs });
  }
  saveDB(); closeModal(); toast('Class saved', 'ok'); pageClasses();

function deleteClass(id){
  if (!guard(false, 'admin')) return;
  const count = DB.students.filter(s => s.classId === id).length;
  if (count) return toast('Cannot delete: ' + count + ' students are enrolled.', 'bad');
  if (!confirm('Delete class "' + clsName(id) + '"?')) return;
  DB.classes = DB.classes.filter(c => c.id !== id);
  saveDB(); toast('Class deleted', 'ok'); pageClasses();
}

/* ---------------------------------------------------------------------------
   11. RESULTS (TEST / EXAM)
--------------------------------------------------------------------------- */
let resFilter = { period: 'month', classId: 'all', subject: 'all', q: '' };

function pageResults(kind){
  const title = kind === 'exam' ? 'Exam Results' : 'Test Results';
  const subjects = [...new Set(DB.tests.map(t => t.subject))];
  const rows = [];

  DB.tests.filter(t => t.kind === kind).forEach(t => {
    if (resFilter.classId !== 'all' && t.classId !== resFilter.classId) return;
    if (resFilter.subject !== 'all' && t.subject !== resFilter.subject) return;
    if (!inRange(t.date, resFilter.period)) return;
    Object.entries(t.records || {}).forEach(([sid, r]) => {
      const s = DB.students.find(x => x.id === sid);
      if (!s) return;
      const q = resFilter.q.trim().toLowerCase();
      if (q && !(s.name.toLowerCase().includes(q) || String(s.roll).includes(q))) return;
      const obtained = r.absent ? 0 : (Number(r.theory || 0) + Number(r.practical || 0));
      const total = Number(t.total || 0) + Number(t.practicalMax || 0);
      const pct = total ? (obtained / total) * 100 : 0;
      rows.push({ s, t, obtained, total, pct, absent: r.absent });
    });
  });

  document.getElementById('view').innerHTML = `
  ${pageHead(title, 'Filter by period, class and subject — print result cards and lists')}
  <div class="card">
    <div class="grid3">
      <label class="fld">Period
        <select onchange="resFilter.period=this.value;pageResults('${kind}')">
          ${[['day','Today'],['week','This Week'],['month','This Month'],['year','This Year'],['all','All Time']]
            .map(([v,l]) => `<option value="${v}" ${resFilter.period === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </label>
      <label class="fld">Class
        <select onchange="resFilter.classId=this.value;pageResults('${kind}')">
          <option value="all" ${resFilter.classId === 'all' ? 'selected' : ''}>All Classes</option>
          ${classOptions(resFilter.classId)}
        </select>
      </label>
      <label class="fld">Subject
        <select onchange="resFilter.subject=this.value;pageResults('${kind}')">
          <option value="all" ${resFilter.subject === 'all' ? 'selected' : ''}>All Subjects</option>
          ${subjects.map(s => `<option ${resFilter.subject === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
        </select>
      </label>
    </div>
    <div class="row wrap gap mt">
      <input class="search grow" placeholder="Search by student name or roll number" value="${esc(resFilter.q)}"
        oninput="resFilter.q=this.value;pageResults('${kind}')">
      <button class="btn sm" onclick="nav('marks',{kind:'${kind}'})">📝 Enter / Update Marks</button>
      <button class="btn ghost sm" onclick="printResultsList('${kind}')">🖨️ Print Results</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Result Records</h2><span class="pill">${rows.length} record(s)</span></div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>Student</th><th>Class</th><th>Assessment</th><th>Date</th><th>Marks</th><th>Percentage</th><th>Grade</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${rows.length ? rows.map((r, i) => `<tr>
            <td><b>${esc(r.s.name)}</b><div class="muted sm">S/O ${esc(r.s.father)} · Roll ${esc(r.s.roll)}</div></td>
            <td>${esc(clsName(r.s.classId))}</td>
            <td>${esc(r.t.title)}<div class="muted sm">${esc(r.t.subject)}</div></td>
            <td>${esc(r.t.date)}</td>
            <td>${r.absent ? '<span class="pill bad">Absent</span>' : esc(r.obtained) + ' / ' + esc(r.total)}</td>
            <td>${ringHTML(r.pct)}</td>
            <td><b>${grade(r.pct)}</b></td>
            <td>${r.pct >= 40 && !r.absent ? '<span class="pill ok">Pass</span>' : '<span class="pill bad">Fail</span>'}</td>
            <td><button class="btn ghost xs" onclick="printResultCard('${r.t.id}','${r.s.id}')">Card</button></td>
          </tr>`).join('') : `<tr><td colspan="9">${emptyState('No results match the selected filters.')}</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

function printResultsList(kind){
  const rows = [];
  DB.tests.filter(t => t.kind === kind).forEach(t => {
    if (resFilter.classId !== 'all' && t.classId !== resFilter.classId) return;
    if (!inRange(t.date, resFilter.period)) return;
    Object.entries(t.records || {}).forEach(([sid, r]) => {
      const s = DB.students.find(x => x.id === sid);
      if (!s) return;
      const obtained = r.absent ? 0 : Number(r.theory || 0) + Number(r.practical || 0);
      const total = Number(t.total || 0) + Number(t.practicalMax || 0);
      rows.push({ s, t, obtained, total, pct: total ? obtained / total * 100 : 0 });
    });
  });
  const body = `<table><thead><tr><th>#</th><th>Student</th><th>Father</th><th>Class</th><th>Assessment</th><th>Obtained</th><th>Total</th><th>%</th><th>Grade</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.s.name)}</td><td>${esc(r.s.father)}</td>
      <td>${esc(clsName(r.s.classId))}</td><td>${esc(r.t.title)}</td><td>${r.obtained}</td><td>${r.total}</td>
      <td>${Math.round(r.pct)}%</td><td>${grade(r.pct)}</td></tr>`).join('')}
  </tbody></table>`;
  printDoc((kind === 'exam' ? 'Examination' : 'Test') + ' Results', body, 'Period: ' + resFilter.period);
}

function printResultCard(testId, studentId){
  const t = DB.tests.find(x => x.id === testId);
  const s = DB.students.find(x => x.id === studentId);
  if (!t || !s) return;
  const r = t.records[studentId] || {};
  const obtained = r.absent ? 0 : Number(r.theory || 0) + Number(r.practical || 0);
  const total = Number(t.total || 0) + Number(t.practicalMax || 0);
  const pct = total ? obtained / total * 100 : 0;
  const body = `<table><tbody>
    <tr><th style="width:35%">Student</th><td>${esc(s.name)}</td></tr>
    <tr><th>Father's Name</th><td>${esc(s.father)}</td></tr>
    <tr><th>Class</th><td>${esc(clsName(s.classId))} (${esc(s.section)})</td></tr>
    <tr><th>Roll Number</th><td>${esc(s.roll)}</td></tr>
    <tr><th>Assessment</th><td>${esc(t.title)} — ${esc(t.subject)}</td></tr>
    <tr><th>Date</th><td>${esc(t.date)}</td></tr>
    <tr><th>Theory Marks</th><td>${r.absent ? '—' : esc(r.theory || 0)} / ${esc(t.total)}</td></tr>
    <tr><th>Practical Marks</th><td>${r.absent ? '—' : esc(r.practical || 0)} / ${esc(t.practicalMax || 0)}</td></tr>
    <tr><th>Total Marks</th><td><b>${r.absent ? 'Absent' : obtained + ' / ' + total}</b></td></tr>
    <tr><th>Percentage</th><td><b>${Math.round(pct)}%</b></td></tr>
    <tr><th>Grade</th><td><b>${grade(pct)}</b></td></tr>
    <tr><th>Status</th><td><b>${pct >= 40 && !r.absent ? 'PASS' : 'FAIL'}</b></td></tr>
  </tbody></table>`;

            const r = (test.records || {})[s.id] || {};

function openNewTest(){
  if (!guard(true)) return;
  openModal('New Assessment', `
    <div class="grid2">
      <label class="fld">Title<input id="ntTitle" placeholder="e.g. English Test"></label>
      <label class="fld">Date<input id="ntDate" type="date" value="${todayISO()}"></label>
      <label class="fld">Total Theory Marks<input id="ntTotal" type="number" value="15"></label>
      <label class="fld">Total Practical Marks<input id="ntPrac" type="number" value="0"></label>
    </div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn" onclick="createTest()">Create</button>`);
}

function createTest(){
  const title = document.getElementById('ntTitle').value.trim();
  const date = document.getElementById('ntDate').value || todayISO();
  const total = Number(document.getElementById('ntTotal').value || 0);
  const practicalMax = Number(document.getElementById('ntPrac').value || 0);
  if (!title) return toast('Title is required', 'bad');
  if (total <= 0 && practicalMax <= 0) return toast('Total marks must be greater than 0', 'bad');
  const t = {
    id: uid('te'), kind: mkState.kind, classId: mkState.classId, subject: mkState.subject,
    title, date, total, practicalMax, records: {}
  };
  DB.tests.push(t);
  mkState.testId = t.id;
  saveDB(); closeModal(); toast('Assessment created', 'ok'); pageMarks();
}

function saveMarks(submit){
  if (!guard(true)) return;
  const t = DB.tests.find(x => x.id === mkState.testId);
  if (!t) return toast('Select an assessment first', 'bad');
  let error = false;
  DB.students.filter(s => s.classId === mkState.classId).forEach(s => {
    const th = document.getElementById('th-' + s.id);
    const pr = document.getElementById('pr-' + s.id);
    const ab = document.getElementById('ab-' + s.id);
    if (!th) return;
    if (ab.checked) { t.records[s.id] = { theory: 0, practical: 0, absent: true }; return; }
    const theory = th.value === '' ? null : Number(th.value);
    const practical = pr && pr.value !== '' ? Number(pr.value) : 0;
    if (theory === null) { delete t.records[s.id]; return; }
    if (theory > t.total || practical > (t.practicalMax || 0)) { error = true; return; }
    t.records[s.id] = { theory, practical, absent: false };
  });
  saveDB();
  if (error) toast('Some marks exceeded the maximum and were skipped', 'bad');
  else toast(submit ? 'Class result submitted' : 'Marks saved', 'ok');
  pageMarks();
}

function printSubjectMarks(){
  const t = DB.tests.find(x => x.id === mkState.testId);
  if (!t) return toast('Select an assessment first', 'bad');
  const students = DB.students.filter(s => s.classId === mkState.classId).sort(byRoll);
  const body = `<table><thead><tr><th>Roll</th><th>Student</th><th>Father</th><th>Theory</th><th>Practical</th><th>Total</th><th>Status</th></tr></thead><tbody>
    ${students.map(s => {
      const r = t.records[s.id] || {};
      const obt = r.absent ? 0 : Number(r.theory || 0) + Number(r.practical || 0);
      return `<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${esc(s.father)}</td>
        <td>${r.theory !== undefined ? esc(r.theory) : '—'}</td>
        <td>${r.practical !== undefined ? esc(r.practical) : '—'}</td>
        <td>${r.absent ? 'Absent' : (r.theory !== undefined ? obt : '—')}</td>
        <td>${r.absent ? 'Absent' : (r.theory !== undefined ? 'Present' : 'Pending')}</td></tr>`;
    }).join('')}
  </tbody></table>`;
  printDoc('Subject-Wise Marks List', body,
    `${clsName(mkState.classId)} — ${mkState.subject} — ${t.title} (${t.date})`);
}

const feeState = { month: new Date().toISOString().slice(0, 7), status: 'all', q: '' };

    .map(f => Object.assign({}, f, { s: DB.students.find(s => s.id === f.studentId) }))
    .filter(f => f.s)
    .filter(f => feeState.status === 'all' || f.status === feeState.status)
    .filter(f => {
      const q = feeState.q.trim().toLowerCase();
      return !q || (f.s.name + ' ' + f.s.roll + ' ' + clsName(f.s.classId)).toLowerCase().includes(q);
    });

  document.getElementById('view').innerHTML = `

  </div>

    <div class="grid3">
      <label class="fld">Month<input type="month" value="${feeState.month}" onchange="feeState.month=this.value;pageFees()"></label>
      <label class="fld">Status
        <select onchange="feeState.status=this.value;pageFees()">
          ${['all','Paid','Unpaid','Partial'].map(s => `<option value="${s}" ${feeState.status === s ? 'selected' : ''}>${s === 'all' ? 'All Statuses' : s}</option>`).join('')}
        </select>
      </label>
      <label class="fld">Search<input class="search" placeholder="Student name or roll" value="${esc(feeState.q)}" oninput="feeState.q=this.value;pageFees()"></label>
    </div>
    <div class="row wrap gap mt">
      <button class="btn sm" onclick="generateMonthlyFees()">⚙️ Generate Monthly Fees</button>
      <button class="btn ghost sm" onclick="printFeeReport()">🖨️ Print Report</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Fee Records</h2><span class="pill">${list.length}</span></div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>Student</th><th>Class</th><th>Type</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${list.length ? list.map(f => `<tr>
            <td><b>${esc(f.s.name)}</b><div class="muted sm">Roll ${esc(f.s.roll)}</div></td>
            <td>${esc(clsName(f.s.classId))}</td>
            <td>${esc(f.type)}</td>
            <td>${money(f.amount)}</td>
            <td>${money(f.paid)}</td>
            <td>${money(Math.max(0, f.amount - f.paid))}</td>

function generateMonthlyFees(){
  if (!guard(false, 'admin')) return;
  let created = 0;
  DB.students.forEach(s => {
    if (!DB.fees.find(f => f.studentId === s.id && f.month === feeState.month)) {
      DB.fees.push({
        id: uid('f'), studentId: s.id, month: feeState.month, type: 'Monthly Fee',
        amount: 3500, paid: 0, status: 'Unpaid', date: '', method: 'Cash'
      });
      created++;
    }
  });
  saveDB();
  toast(created ? created + ' fee record(s) generated' : 'All records already exist', created ? 'ok' : '');
  pageFees();
}

function openPayment(id){
  if (!guard(true)) return;
  const f = DB.fees.find(x => x.id === id);
  if (!f) return;
  const s = DB.students.find(x => x.id === f.studentId) || {};
  const balance = Math.max(0, f.amount - f.paid);
  openModal('Collect Fee — ' + (s.name || ''), `
    <p class="muted sm">Balance: <b>${money(balance)}</b></p>
    <div class="grid2">

function confirmPayment(id){
  const f = DB.fees.find(x => x.id === id);
  const amt = Number(document.getElementById('payAmt').value || 0);
  const disc = Number(document.getElementById('payDisc').value || 0);
  if (amt <= 0 && disc <= 0) return toast('Enter a valid amount', 'bad');
  f.paid = Math.min(f.amount, (f.paid || 0) + amt + disc);
  f.date = document.getElementById('payDate').value || todayISO();
  f.method = document.getElementById('payMethod').value;
  f.status = f.paid >= f.amount ? 'Paid' : (f.paid > 0 ? 'Partial' : 'Unpaid');
  saveDB(); closeModal(); toast('Payment recorded', 'ok'); pageFees();
}

    </div>`,

function saveTimetableEntry(){
  const day = document.getElementById('ttDay').value;
  const start = document.getElementById('ttStart').value;
  const end = document.getElementById('ttEnd').value;
  const teacher = document.getElementById('ttTeacher').value;
  const period = Number(document.getElementById('ttPeriod').value);

  if (end <= start) return toast('End time must be after start time', 'bad');

  const clash = DB.timetable.some(e =>
    e.day === day && e.teacher === teacher && !(end <= e.start || start >= e.end));
  if (clash) return toast('Conflict: ' + teacher + ' is already assigned at this time.', 'bad');

  const classClash = DB.timetable.some(e =>
    e.day === day && e.classId === ttState.classId && !(end <= e.start || start >= e.end));
  if (classClash) return toast('Conflict: this class already has a period at this time.', 'bad');

  DB.timetable.push({
    id: uid('tt'), classId: ttState.classId, day, period, start, end,
    subject: document.getElementById('ttSubject').value,
    teacher, room: document.getElementById('ttRoom').value.trim() || 'R-1'
  });
  saveDB(); closeModal(); toast('Period added', 'ok'); pageTimetable();
}

function deleteTimetableEntry(id){
  if (!guard(false, 'admin')) return;
  if (!confirm('Remove this period?')) return;
  DB.timetable = DB.timetable.filter(e => e.id !== id);
  saveDB(); toast('Period removed', 'ok'); pageTimetable();
}

function printTimetable(){
  const days = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
  const entries = DB.timetable.filter(t => t.classId === ttState.classId);
  const body = `<table><thead><tr><th>Day</th><th>Period</th><th>Time</th><th>Subject</th><th>Teacher</th><th>Room</th></tr></thead><tbody>
    ${days.map(day => entries.filter(e => e.day === day).sort((a, b) => a.period - b.period)
      .map(e => `<tr><td>${esc(e.day)}</td><td>${e.period}</td><td>${esc(e.start)} – ${esc(e.end)}</td>
        <td>${esc(e.subject)}</td><td>${esc(e.teacher)}</td><td>${esc(e.room)}</td></tr>`).join('')).join('')}
  </tbody></table>`;
  printDoc('Class Timetable — ' + clsName(ttState.classId), body, 'Weekly schedule');
}

function submitApplication(){

  DB.applications.push({

  });

function reviewApplication(id, status){
  if (!guard(false, 'admin')) return;
  const a = DB.applications.find(x => x.id === id);
  if (!a) return;
  a.status = status;
  a.comment = status === 'Accepted' ? 'Approved by Admin' : status === 'Rejected' ? 'Rejected by Admin' : '';
  saveDB(); toast('Application ' + status.toLowerCase(), status === 'Rejected' ? 'bad' : 'ok');
  pageApplications();

  if (!title) return toast('Title is required', 'bad');
  DB.lectures.push({
    id: uid('lc'), classId: document.getElementById('lcClass').value,
    subject: document.getElementById('lcSubject').value, title,
    link: document.getElementById('lcLink').value.trim(),
    notes: document.getElementById('lcNotes').value.trim(), date: todayISO()
  });
  saveDB(); toast('Lecture uploaded', 'ok'); pageLectures();
}
function deleteLecture(id){
  if (!guard(true)) return;
  if (!confirm('Delete this lecture?')) return;
  DB.lectures = DB.lectures.filter(l => l.id !== id);
  saveDB(); toast('Lecture deleted', 'ok'); pageLectures();
}

/* ---------------------------------------------------------------------------
   20. QUIZ & MCQs
--------------------------------------------------------------------------- */
function pageQuiz(){
  const list = DB.quizzes.slice().reverse();
  document.getElementById('view').innerHTML = `
  ${pageHead('Quiz & MCQs', 'Create multiple-choice quizzes and attempt them')}
  <div class="card">
    <div class="card-head"><h2>Create Quiz</h2></div>
    <div class="grid2">
      <label class="fld">Class<select id="qzClass">${classOptions(DB.classes[0].id)}</select></label>
      <label class="fld">Subject
        <select id="qzSubject">${['English','Urdu','Mathematics','Islamiat','Science','Computer']
          .map(s => `<option>${s}</option>`).join('')}</select></label>
    </div>
    <label class="fld mt">Quiz Title<input id="qzTitle" placeholder="e.g. Grammar Quiz 1"></label>
    <label class="fld mt">Questions — one per line, format:
      <span class="muted sm">Question | Option1 | Option2 | Option3 | Correct option number (1-based)</span>
      <textarea id="qzQs" placeholder="Which word is a noun? | Run | Apple | Quickly | 2"></textarea>
    </label>
    <button class="btn sm mt" onclick="saveQuiz()">＋ Create Quiz</button>
  </div>

  <div class="card">
    <div class="card-head"><h2>Available Quizzes</h2><span class="pill">${list.length}</span></div>
    ${list.length ? list.map(q => `
      <div class="att-row">
        <div class="att-info">
          <div class="att-name">${esc(q.title)}</div>
          <div class="att-sub">${esc(clsName(q.classId))} · ${esc(q.subject)} · ${q.questions.length} questions</div>
        </div>
        <div class="row gap">
          <button class="btn sm" onclick="startQuiz('${q.id}')">Attempt</button>
          <button class="btn red xs" onclick="deleteQuiz('${q.id}')">Delete</button>
        </div>
      </div>`).join('') : emptyState('No quizzes created yet.', '❓')}
  </div>`;
}

function saveQuiz(){
  if (!guard(true)) return;
  const title = document.getElementById('qzTitle').value.trim();
  const raw = document.getElementById('qzQs').value.trim();
  if (!title) return toast('Quiz title is required', 'bad');
  if (!raw) return toast('Add at least one question', 'bad');

  const questions = [];
  raw.split('\n').forEach(line => {
    const parts = line.split('|').map(p => p.trim());
    if (parts.length >= 5) {
      questions.push({ q: parts[0], options: [parts[1], parts[2], parts[3]], answer: Math.max(1, Math.min(3, Number(parts[4]) || 1)) - 1 });
    }
  });
  if (!questions.length) return toast('No valid questions found. Check the format.', 'bad');

  DB.quizzes.push({
    id: uid('qz'), classId: document.getElementById('qzClass').value,
    subject: document.getElementById('qzSubject').value, title, questions
  });
  saveDB(); toast('Quiz created', 'ok'); pageQuiz();
}

function deleteQuiz(id){
  if (!guard(true)) return;
  if (!confirm('Delete this quiz?')) return;
  DB.quizzes = DB.quizzes.filter(q => q.id !== id);
  saveDB(); toast('Quiz deleted', 'ok'); pageQuiz();
}

function startQuiz(id){
  const q = DB.quizzes.find(x => x.id === id);
  if (!q) return;
  openModal(q.title, q.questions.map((item, i) => `
    <div class="mb">
      <b>${i + 1}. ${esc(item.q)}</b>
      ${item.options.map((o, oi) => `
        <label class="row gap" style="margin-top:6px;cursor:pointer">
          <input type="radio" name="qz-${i}" value="${oi}" style="width:18px;height:18px">
          <span>${esc(o)}</span>
        </label>`).join('')}
    </div>`).join(''),
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn green" onclick="submitQuiz('${id}')">Submit Quiz</button>`, true);
}

function submitQuiz(id){
  const q = DB.quizzes.find(x => x.id === id);
  if (!q) return;
  let score = 0;
  q.questions.forEach((item, i) => {
    const sel = document.querySelector(`input[name="qz-${i}"]:checked`);
    if (sel && Number(sel.value) === item.answer) score++;
  });
  const pct = Math.round(score / q.questions.length * 100);
  closeModal();
  openModal('Quiz Result', `
    <div style="text-align:center;padding:10px 0">
      ${ringHTML(pct)}
      <h2 style="margin-top:12px">${score} / ${q.questions.length} correct</h2>
      <p class="muted">${pct >= 40 ? 'Passed — well done!' : 'Below passing marks — please revise.'}</p>
    </div>`,
    `<button class="btn" onclick="closeModal()">Done</button>`);
}
